[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftguard"
version = "0.1.0"
description = "Schema drift & data-contract testing for your CI pipeline — catch breaking database changes before they break your dashboards."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DriftGuard" }]
keywords = [
    "schema-drift",
    "data-contract",
    "data-quality",
    "data-observability",
    "database-migration",
    "ci",
    "postgres",
    "mysql",
    "snowflake",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
# The core engine has ZERO required runtime dependencies (stdlib only).
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
dev = ["pytest>=7.4"]

[project.scripts]
driftguard = "driftguard.cli:main"

[project.urls]
Homepage = "https://github.com/manijose1919/schema-drift-guard"
Documentation = "https://github.com/manijose1919/schema-drift-guard#readme"
Source = "https://github.com/manijose1919/schema-drift-guard"

[tool.hatch.build.targets.wheel]
packages = ["src/driftguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
